[package]
name = "benchmark"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }

# meta crates
dashu = { path = ".." }
malachite = "0.9.2"
num = "0.4.3"
rug = { version = "1.30.0", optional = true }
rust-gmp = { version = "0.5.0", optional = true }

# integer crates
ibig = "0.3.6"
ramp = { version = "0.7.0", optional = true }

# float crates
bigdecimal = "0.4.10"
astro-float = "0.9.5"

[features]
gmp = ["rug", "rust-gmp"]
