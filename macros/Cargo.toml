[package]
name = "dashu-macros"
version = "0.6.0-rc.3"
authors = ["Jacob Zhong <cmpute@gmail.com>"]
edition = "2021"
description = "Procedural macros for the dashu math types: create big-number literals at compile time with ubig!, ibig!, fbig!, dbig!, rbig!, and cbig! (plus their static_ variants for const contexts). Each literal follows the same parsing rules as the corresponding dashu type, producing values of UBig, IBig, FBig, RBig, or CBig in any supported base."
keywords = ["mathematics", "numerics", "arbitrary-precision"]
categories = ["mathematics", "no-std"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cmpute/dashu"
homepage = "https://github.com/cmpute/dashu/tree/master/macros"
documentation = "https://docs.rs/dashu-macros"
readme = "README.md"
rust-version = "1.68"

[package.metadata]
maintenance = "actively-developed"

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
dashu-base = { version = "0.6.0-rc.3", default-features = false, path = "../base" }
dashu-int = { version = "0.6.0-rc.3", default-features = false, path = "../integer" }
dashu-float = { version = "0.6.0-rc.3", default-features = false, path = "../float" }
dashu-ratio = { version = "0.6.0-rc.3", default-features = false, path = "../rational" }
dashu-cmplx = { version = "0.6.0-rc.3", default-features = false, path = "../complex" }

quote = "1"
proc-macro2 = "1"
pastey = "0.2"
rustversion = "1.0"
