[package]
name = "dashu-python"
version = "0.6.0"
authors = ["Jacob Zhong <cmpute@gmail.com>"]
edition = "2024"
description = "PyO3 Python binding for the dashu numeric types — a user-friendly way to do arbitrary-precision math in Python without a Rust toolchain. Provides UBig, IBig, RBig, FBig, DBig, and CBig with full arithmetic, comparisons, format() support, and panic-free transcendentals, plus optional serde, rand, rkyv, and zeroize integrations. Distributed on PyPI as dashu-rs."
keywords = ["mathematics", "numerics"]
categories = ["mathematics", "science"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cmpute/dashu"
homepage = "https://github.com/cmpute/dashu/tree/master/python"
documentation = "https://docs.rs/dashu-python"
readme = "README.md"
rust-version = "1.85"

[package.metadata]
maintenance = "actively-developed"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
serde = ["dep:serde", "dep:serde_json", "dep:postcard", "dashu/serde"]
rand = ["dep:rand", "dashu/rand"]
rkyv = ["dep:rkyv", "dashu/rkyv"]
zeroize = ["dep:zeroize", "dashu/zeroize"]

[dependencies]
# everything comes from the `dashu` meta crate; the `tuning` feature is extra (exposes
# `ziv_retries`/`ziv_retries_reset` on dashu-float).
dashu = { version = "0.6.0", path = "..", features = ["tuning"] }
num-order = "1.2.0"

# optional third-party integrations (enabled by the matching feature above)
serde = { version = "1.0", optional = true, default-features = false, features = ["alloc"] }
serde_json = { version = "1.0", optional = true, default-features = false, features = ["alloc"] }
postcard = { version = "1.0", optional = true, default-features = false, features = ["alloc"] }
rand = { version = "0.10", optional = true, default-features = false, features = ["thread_rng"] }
rkyv = { version = "0.8", optional = true, default-features = false, features = ["alloc", "pointer_width_32"] }
zeroize = { version = "1.5", optional = true, default-features = false }

[dependencies.pyo3]
version = "0.29"
# `multiple-pymethods` lets a type's methods span several `#[pymethods]` blocks, so the
# transcendental methods can be generated by macros (impl_float_math! / impl_cpy_math!)
# in their own block rather than hand-written per type.
features = ["extension-module", "multiple-pymethods"]

[lib]
name = "dashu"
crate-type = ["cdylib"]
