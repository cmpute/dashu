[package]
name = "dashu-cmplx"
version = "0.6.0-rc.3"
authors = ["Jacob Zhong <cmpute@gmail.com>"]
edition = "2021"
description = "An arbitrary-precision complex math library for Rust — the Rust-native alternative to GNU MPC. Provides CBig and CachedCBig, built on dashu-float's FBig, with field arithmetic, elementary transcendentals, and abs/arg/conj/proj plus I/O, following the C99 Annex G / Kahan branch-cut and signed-zero model. Optional serde, rand, num-traits, rkyv, zeroize, and num-complex interop."
keywords = ["mathematics", "numerics", "complex", "arbitrary-precision", "bignum"]
categories = ["mathematics", "no-std"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cmpute/dashu"
homepage = "https://github.com/cmpute/dashu/tree/master/complex"
documentation = "https://docs.rs/dashu-cmplx"
readme = "README.md"
rust-version = "1.68"

[package.metadata]
maintenance = "actively-developed"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std", "num-order"]
std = ["dashu-float/std"]

# stable dependencies
serde = ["dep:serde", "dashu-float/serde"]
zeroize = ["dep:zeroize", "dashu-float/zeroize"]
num-order = ["dep:num-order", "dep:_num-modular", "dashu-float/num-order"]

# unstable dependencies
rand = ["rand_v010"]
rand_v08 = ["dep:rand_v08", "dashu-float/rand_v08", "dashu-int/rand_v08"]
rand_v09 = ["dep:rand_v09", "dashu-float/rand_v09", "dashu-int/rand_v09"]
rand_v010 = ["dep:rand_v010", "dashu-float/rand_v010", "dashu-int/rand_v010"]
num-traits = ["num-traits_v02"]
num-traits_v02 = ["dep:num-traits_v02", "dashu-float/num-traits_v02"]
num-complex = ["dep:num-complex_v04"]
rkyv = ["rkyv_v08"]
rkyv_v07 = ["dep:rkyv_v07", "dashu-float/rkyv_v07"]
rkyv_v08 = ["dep:rkyv_v08", "dashu-float/rkyv_v08"]

[dependencies]
dashu-base = { version = "0.6.0-rc.3", default-features = false, path = "../base" }
dashu-int = { version = "0.6.0-rc.3", default-features = false, path = "../integer" }
dashu-float = { version = "0.6.0-rc.3", default-features = false, path = "../float" }

# stable dependencies
rustversion = "1.0.0"
num-order = { optional = true, version = "1.2.0", default-features = false }
_num-modular = { optional = true, version = "0.6.1", package = "num-modular", default-features = false }
serde = { optional = true, version = "1.0.130", default-features = false }
zeroize = { optional = true, version = "1.5.7", default-features = false }

# unstable dependencies
rand_v08 = { optional = true, version = "0.8.3", package = "rand", default-features = false }
rand_v09 = { optional = true, version = "0.9", package = "rand", default-features = false }
rand_v010 = { optional = true, version = "0.10", package = "rand", default-features = false }
num-traits_v02 = { optional = true, version = "0.2.15", package = "num-traits", default-features = false }
num-complex_v04 = { optional = true, version = "0.4", package = "num-complex", default-features = false }
rkyv_v07 = { optional = true, version = "0.7", package = "rkyv", default-features = false, features = ["alloc", "size_32"] }
rkyv_v08 = { optional = true, version = "0.8", package = "rkyv", default-features = false, features = ["alloc", "pointer_width_32"] }

[dev-dependencies]
rand_v08 = { version = "0.8.3", package = "rand" }
rand_v09 = { version = "0.9", package = "rand" }
rand_v010 = { version = "0.10", package = "rand" }
proptest = "~1.7"
serde_json = { version = "1.0" }
serde_test = { version = "1.0.130" }
postcard = { version = "1.0.2", features = ["alloc"] }
rkyv_v07 = { version = "0.7", package = "rkyv", default-features = false, features = ["alloc", "size_32"] }

# num-complex is needed only by tests: as the live reference for `CBig`'s `NumHash` (the
# `num-order` feature gates the impl, but the `num-order/num-complex` sub-feature that puts
# `NumHash` on `Complex<f64>` is test-only), and for the `num-complex` conversion tests.
num-complex_v04 = { version = "0.4", package = "num-complex" }
num-order = { version = "1.2.0", default-features = false, features = ["num-complex"] }

criterion = { version = "0.5.1", features = ["html_reports"] }

[lib]
bench = false

[[test]]
name = "random"
required-features = ["rand_v08"]

[[test]]
name = "serde"
required-features = ["serde"]

[[test]]
name = "rkyv"
required-features = ["rkyv"]

[[bench]]
name = "arith"
harness = false
required-features = ["rand"]

[[bench]]
name = "transcendental"
harness = false
required-features = ["rand"]

[[bench]]
name = "io"
harness = false
required-features = ["rand"]
