name: Lints

on:
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lints-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  dylint:
    name: Dylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly (must match dashu-lints/rust-toolchain)
        run: |
          rustup toolchain install nightly-2026-04-16 --profile minimal \
            --component rustc-dev \
            --component llvm-tools-preview \
            --component rustfmt \
            --component clippy
      - name: Install dylint
        run: cargo +nightly-2026-04-16 install cargo-dylint dylint-link --version 6.1.0 --locked
      - name: Check lint formatting
        working-directory: dashu-lints
        run: cargo fmt --all -- --check
      - name: Lint examples and check diagnostic snapshots
        working-directory: dashu-lints
        run: cargo test --lib --locked -- --nocapture
      - name: Check lint implementation
        working-directory: dashu-lints
        run: cargo clippy --lib --locked -- -D warnings

  house-lints:
    name: House lints (warnings are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly (must match dashu-lints/rust-toolchain)
        run: |
          rustup toolchain install nightly-2026-04-16 --profile minimal \
            --component rustc-dev \
            --component llvm-tools-preview \
            --component rustfmt
      - name: Install Dylint
        run: cargo +nightly-2026-04-16 install cargo-dylint dylint-link --version 6.1.0 --locked
      - name: Check the workspace with house lints
        env:
          DYLINT_RUSTFLAGS: -D warnings
        run: cargo +nightly-2026-04-16 dylint --all -- --workspace --exclude dashu-python --all-features --all-targets
